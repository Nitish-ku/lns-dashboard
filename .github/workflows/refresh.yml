name: Refresh data

on:
  schedule:
    - cron: "0 11 * * *"   # every day 11:00 UTC (7am ET): yesterday's calls and EOCs are in
  workflow_dispatch:         # "Run workflow" button for an on-demand refresh

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data/bookings.json from GHL + Close (read only)
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        run: python scripts/build_data.py
      - name: Commit if the numbers changed
        run: |
          git config user.name "lns-dashboard bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bookings.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Refresh data $(date -u +%Y-%m-%dT%H:%MZ)" && git push; fi
